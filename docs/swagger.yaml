info:
  title: opsnap API
  version: "1.0"
paths:
  /apikeys:
    get:
      consumes:
      - application/json
      description: 列出未撤销的 API 密钥
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/apikey.ListResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: 列出未撤销的 API 密钥
      tags:
      - apikey
    post:
      consumes:
      - application/json
      description: 创建 API 密钥。密钥不区分权限，等同管理员。
      parameters:
      - in: body
        name: body
        schema:
          $ref: '#/definitions/apikey.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/apikey.CreateResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: 创建 API 密钥。密钥不区分权限，等同管理员。
      tags:
      - apikey
  /apikeys/{id}:
    delete:
      consumes:
      - application/json
      description: 撤销 API 密钥，立即生效
      parameters:
      - in: path
        name: id
        required: true
        type: integer
      - in: body
        name: body
        schema:
          $ref: '#/definitions/apikey.RevokeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/apikey.RevokeResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: 撤销 API 密钥，立即生效
      tags:
      - apikey
  /auth/login:
    post:
      consumes:
      - application/json
      description: 登录；成功后通过 HttpOnly Cookie 下发会话。密码登录关闭时返回 403
      parameters:
      - in: body
        name: body
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/auth.LoginResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: 登录；成功后通过 HttpOnly Cookie 下发会话。密码登录关闭时返回 403
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 退出登录，使当前会话失效
      parameters:
      - in: body
        name: body
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/auth.LogoutResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: 退出登录，使当前会话失效
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: 当前身份
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/auth.MeResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: 当前身份
      tags:
      - auth
  /auth/oidc/callback:
    get:
      consumes:
      - application/json
      description: |-
        提供方授权后浏览器回到这里（未登录可访问）。
        校验通过后建立会话并跳到登录前的页面（绑定时回到设置页）；不通过时跳回登录页，地址里带 sso_error。
      parameters:
      - in: query
        name: code
        type: string
      - in: query
        name: state
        type: string
      - in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/auth.OIDCCallbackResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: |-
        提供方授权后浏览器回到这里（未登录可访问）。
        校验通过后建立会话并跳到登录前的页面（绑定时回到设置页）；不通过时跳回登录页，地址里带 sso_error。
      tags:
      - auth
  /auth/oidc/login:
    post:
      consumes:
      - application/json
      description: |-
        开始单点登录（未登录可访问）：返回提供方授权页地址。
        next 是登录后要回到的站内路径，不是站内路径时回到首页。
      parameters:
      - in: body
        name: body
        schema:
          $ref: '#/definitions/auth.OIDCLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/auth.OIDCLoginResponse'
              msg:
                type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/BadRequest'
      summary: |-
        开始单点登录（未登录可访问）：返回提供方授权页地址。
