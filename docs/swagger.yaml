basePath: /api/v1
definitions:
  BadRequest:
    properties:
      code:
        description: 错误码
        format: int32
        type: integer
      msg:
        description: 错误信息
        type: string
    type: object
  apikey.CreateRequest:
    properties:
      expires_in:
        type: string
      name:
        type: string
    type: object
  apikey.CreateResponse:
    properties:
      key:
        description: 完整密钥，仅此一次返回
        type: string
    type: object
  apikey.Item:
    properties:
      created_at:
        type: integer
      expires_at:
        description: Unix 秒，0 表示永不过期
        type: integer
      id:
        type: integer
      last_used_at:
        description: Unix 秒，0 表示从未使用
        type: integer
      name:
        type: string
      prefix:
        description: 密钥前几位，用于识别
        type: string
    type: object
  apikey.ListResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/apikey.Item'
        type: array
    type: object
  apikey.RevokeRequest:
    type: object
  apikey.RevokeResponse:
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  auth.ChangePasswordResponse:
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      username:
        type: string
    type: object
  auth.LogoutRequest:
    type: object
  auth.LogoutResponse:
    type: object
  auth.MeResponse:
    properties:
      key_id,omitempty:
        description: API 密钥 id
        type: integer
      key_name,omitempty:
        description: API 密钥名称
        type: string
      kind:
        description: admin 或 api_key
        type: string
      username,omitempty:
        description: 管理员用户名
        type: string
    type: object
  auth.OIDCBindRequest:
    type: object
  auth.OIDCBindResponse:
    properties:
      url:
        description: 提供方授权页
        type: string
    type: object
  auth.OIDCLoginRequest:
    properties:
      next:
        type: string
    type: object
  auth.OIDCLoginResponse:
    properties:
      url:
        description: 提供方授权页
        type: string
    type: object
  auth.OIDCResultResponse:
    properties:
      message:
        description: 失败原因；id 不存在或已过期时为空
        type: string
    type: object
  auth.SetupRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  auth.SetupResponse:
    type: object
  auth.StatusResponse:
    properties:
      initialized:
        description: 是否已创建管理员
        type: boolean
      password_login:
        description: 是否允许用户名密码登录（已考虑环境变量 OPSNAP_PASSWORD_LOGIN）
        type: boolean
      sso_enabled:
        description: 是否可以用单点登录（已配置并已绑定账号）
        type: boolean
      sso_label,omitempty:
        description: 登录按钮文字，例如 Gitea
        type: string
    type: object
  credential.CreateRequest:
    properties:
      kind:
        description: password | ssh_key
        type: string
      name:
        type: string
      note:
        type: string
      passphrase:
        type: string
      password:
        type: string
      private_key:
        type: string
      username:
        type: string
    type: object
  credential.CreateResponse:
    type: object
  credential.DeleteRequest:
    type: object
  credential.DeleteResponse:
    type: object
  credential.GetResponse:
    type: object
  credential.Item:
    properties:
      created_at:
        description: Unix 秒
        type: integer
      has_passphrase:
        description: 私钥有没有口令
        type: boolean
      has_secret:
        description: 有没有密码（password 类型）或私钥（ssh_key 类型）
        type: boolean
      id:
        type: integer
      kind:
        description: password | ssh_key
        type: string
      name:
        type: string
      note:
        type: string
      servers:
        description: 使用这条密钥的服务器；没有时是空数组
        items:
          $ref: '#/definitions/credential.ServerRef'
        type: array
      updated_at:
        description: Unix 秒
        type: integer
      username:
        type: string
    type: object
  credential.ListResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/credential.Item'
        type: array
    type: object
  credential.ServerRef:
    properties:
      host:
        type: string
      id:
        type: integer
      name:
        type: string
      port:
        type: integer
      username:
        type: string
    type: object
  credential.UpdateRequest:
    properties:
      kind:
        description: password | ssh_key
        type: string
      name:
        type: string
      note:
        type: string
      passphrase:
        type: string
      password:
        type: string
      private_key:
        type: string
      username:
        type: string
    type: object
  credential.UpdateResponse:
    type: object
  httputils.PageRequest:
    properties:
      order:
        description: Deprecated 请使用方法GetOrder
        type: string
      page:
        description: Deprecated 请使用方法GetPage
        type: integer
      size:
        description: Deprecated 请使用方法GetSize
        type: integer
      sort:
        description: Deprecated 请使用方法GetSort
        type: string
    type: object
  job.AdvancedInput:
    properties:
      bandwidth_kbps:
        description: 限速 KiB/s，0 表示不限速
        type: integer
      compression:
        description: auto | max | off，空表示 auto
        type: string
      extra_args:
        items:
          type: string
        type: array
      timeout_sec:
        description: 超时秒数，0 表示默认 2 小时
        type: integer
    type: object
  job.CheckItem:
    properties:
      fix:
        description: 有修复办法时给出可复制的命令，例如缺少权限时的 GRANT 语句
        type: string
      key:
        type: string
      label:
        type: string
      ok:
        type: boolean
      reason:
        description: 失败原因；成功为空
        type: string
      skipped:
        type: boolean
    type: object
  job.CreateRequest:
    properties:
      advanced:
        $ref: '#/definitions/job.AdvancedInput'
      all_databases:
        type: boolean
      auth_db:
        type: string
      conn_mode:
        type: string
      databases:
        items:
          type: string
        type: array
      db_host:
        type: string
      db_password:
        type: string
      db_port:
        type: integer
      db_user:
        type: string
      excludes:
        items:
          type: string
        type: array
      name:
        type: string
      paths:
        items:
          type: string
        type: array
      paused:
        type: boolean
      repo_id:
        type: integer
      retention:
        $ref: '#/definitions/job.RetentionInput'
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
      server_id:
        type: integer
      source_type:
        type: string
    type: object
  job.CreateResponse:
    type: object
  job.Database:
    properties:
      name:
        type: string
      selectable:
        description: 系统库为 false
        type: boolean
      size_bytes:
        description: 未知为 -1
        type: integer
      system:
        type: boolean
    type: object
  job.DatabasesRequest:
    properties:
      advanced:
        $ref: '#/definitions/job.AdvancedInput'
      all_databases:
        type: boolean
      auth_db:
        type: string
      conn_mode:
        type: string
      databases:
        items:
          type: string
        type: array
      db_host:
        type: string
      db_password:
        type: string
      db_port:
        type: integer
      db_user:
        type: string
      excludes:
        items:
          type: string
        type: array
      id:
        type: integer
      name:
        type: string
      paths:
        items:
          type: string
        type: array
      paused:
        type: boolean
      repo_id:
        type: integer
      retention:
        $ref: '#/definitions/job.RetentionInput'
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
      server_id:
        type: integer
      source_type:
        type: string
    type: object
  job.DatabasesResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/job.Database'
        type: array
      message:
        type: string
      ok:
        type: boolean
      reason:
        description: SSH 链路某一跳失败时同服务器测试的原因（timeout、auth_failed、fingerprint_mismatch
          等，Message 写明第几跳），否则 unreachable | auth_failed | timeout | failed
        type: string
      reason_label:
        type: string
    type: object
  job.DeleteRequest:
    type: object
  job.DeleteResponse:
    type: object
  job.DuplicateRequest:
    type: object
  job.DuplicateResponse:
    type: object
  job.GetResponse:
    type: object
  job.Item:
    properties:
      advanced:
        $ref: '#/definitions/job.AdvancedInput'
      all_databases:
        type: boolean
      attention:
        description: 需要处理：最近一次运行失败或有警告，或太久没有成功
        type: boolean
      auth_db:
        type: string
      conn_mode:
        type: string
      created_at:
        type: integer
      databases:
        items:
          type: string
        type: array
      db_host:
        type: string
      db_password:
        description: 占位「已设置」或空
        type: string
      db_port:
        type: integer
      db_user:
        type: string
      excludes:
        items:
          type: string
        type: array
      id:
        type: integer
      last_run:
        $ref: '#/definitions/job.RunBrief'
        description: 最近一次运行（不含跳过），可能早于 14 天；没有运行过为 null。只在列表里填写
      name:
        type: string
      next_run_at:
        description: 下次运行时间 Unix 秒；已暂停为 0
        type: integer
      paths:
        items:
          type: string
        type: array
      paused:
        type: boolean
      recent_runs:
        description: 最近 14 天的运行（不含跳过），按开始时间升序，任务列表的运行带用。只在列表里填写
        items:
          $ref: '#/definitions/job.RunBrief'
        type: array
      repo_id:
        type: integer
      repo_name:
        type: string
      retention:
        $ref: '#/definitions/job.RetentionInput'
      running:
        description: 正在运行（含排队等待名额），任务列表据此禁用「立即运行」。只在列表里填写
        type: boolean
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
      server_id:
        type: integer
      server_name:
        type: string
      source_type:
        type: string
      updated_at:
        type: integer
    type: object
  job.ListResponse:
    properties:
      list:
        items:
          $ref: '#/definitions/job.Item'
        type: array
    type: object
  job.NextRunsRequest:
    properties:
      count:
        description: 返回几次，默认 5，最多 20
        type: integer
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
    type: object
  job.NextRunsResponse:
    properties:
      times:
        description: Unix 秒
        items:
          type: integer
        type: array
      timezone:
        type: string
    type: object
  job.PauseRequest:
    type: object
  job.PauseResponse:
    type: object
  job.ResumeRequest:
    type: object
  job.ResumeResponse:
    type: object
  job.RetentionInput:
    properties:
      days:
        type: integer
      months:
        type: integer
      preset:
        type: string
      weeks:
        type: integer
    type: object
  job.RunBrief:
    properties:
      bytes_added:
        type: integer
      id:
        type: integer
      started_at:
        type: integer
      status:
        type: string
    type: object
  job.ScheduleInput:
    properties:
      cron:
        description: 5 段 cron 表达式，cron 使用
        type: string
      kind:
        type: string
      time:
        description: 24 小时制 HH:MM，daily 与 weekly 使用
        type: string
      weekday:
        description: 0 表示周日，6 表示周六，weekly 使用
        type: integer
    type: object
  job.TestRequest:
    properties:
      advanced:
        $ref: '#/definitions/job.AdvancedInput'
      all_databases:
        type: boolean
      auth_db:
        type: string
      conn_mode:
        type: string
      databases:
        items:
          type: string
        type: array
      db_host:
        type: string
      db_password:
        type: string
      db_port:
        type: integer
      db_user:
        type: string
      excludes:
        items:
          type: string
        type: array
      id:
        type: integer
      name:
        type: string
      paths:
        items:
          type: string
        type: array
      paused:
        type: boolean
      repo_id:
        type: integer
      retention:
        $ref: '#/definitions/job.RetentionInput'
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
      server_id:
        type: integer
      source_type:
        type: string
    type: object
  job.TestResponse:
    properties:
      checks:
        items:
          $ref: '#/definitions/job.CheckItem'
        type: array
      ok:
        type: boolean
    type: object
  job.UpdateRequest:
    properties:
      advanced:
        $ref: '#/definitions/job.AdvancedInput'
      all_databases:
        type: boolean
      auth_db:
        type: string
      conn_mode:
        type: string
      databases:
        items:
          type: string
        type: array
      db_host:
        type: string
      db_password:
        type: string
      db_port:
        type: integer
      db_user:
        type: string
      excludes:
        items:
          type: string
        type: array
      name:
        type: string
      paths:
        items:
          type: string
        type: array
      paused:
        type: boolean
      repo_id:
        type: integer
      retention:
        $ref: '#/definitions/job.RetentionInput'
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
      server_id:
        type: integer
      source_type:
        type: string
    type: object
  job.UpdateResponse:
    type: object
  notify.GetResponse:
    properties:
      headers:
        additionalProperties:
          type: string
        type: object
      on_failed:
        type: boolean
      on_recovered:
        type: boolean
      on_stale:
        type: boolean
      on_success:
        type: boolean
      panel_url:
        description: 面板地址，消息里的 link 以它开头；面板保存时自动填入浏览器里的地址
        type: string
      stale_hours:
        type: integer
      url:
        type: string
    type: object
  notify.TestRequest:
    type: object
  notify.TestResponse:
    properties:
      status_code:
        type: integer
    type: object
  notify.UpdateRequest:
    properties:
      headers:
        additionalProperties:
          type: string
        type: object
      on_failed:
        type: boolean
      on_recovered:
        type: boolean
      on_stale:
        type: boolean
      on_success:
        type: boolean
      panel_url:
        description: 面板地址（如 http://opsnap.lan:8080），为空时 link 只有路径
        type: string
      stale_hours:
        type: integer
      url:
        type: string
    type: object
  notify.UpdateResponse:
    type: object
  overview.AttentionItem:
    properties:
      job_id:
        type: integer
      job_name:
        type: string
      kind:
        description: failed | warning | stale
        type: string
      last_success_at:
        type: integer
      reason:
        description: 失败原因或警告说明；太久没有成功时是固定说明
        type: string
      repo_id:
        type: integer
      repo_not_mounted:
        description: 任务的存储位置没有挂载，界面给出「检查存储位置」
        type: boolean
      run_id:
        description: 最近一次有结果的运行，查看日志用；没有运行过为 0
        type: integer
      since:
        description: 从何时开始：连续失败（或连续警告）的第一次运行的开始时间，太久没有成功则是越过阈值的时刻
        type: integer
      source_type:
        type: string
    type: object
  overview.GetResponse:
    properties:
      attention:
        items:
          $ref: '#/definitions/overview.AttentionItem'
        type: array
      now:
        description: 服务器当前时间，Unix 秒；时间线的「现在」线以它为准
        type: integer
      repos:
        items:
          $ref: '#/definitions/overview.RepoCard'
        type: array
      summary:
        $ref: '#/definitions/overview.Summary'
      timeline:
        $ref: '#/definitions/overview.Timeline'
      totals:
        $ref: '#/definitions/overview.Totals'
    type: object
  overview.RepoCard:
    properties:
      free_space:
        description: 所在卷剩余字节，未知为 -1
        type: integer
      id:
        type: integer
      jobs:
        type: integer
      name:
        type: string
      ratio:
        description: 去重压缩比 = 原始数据量 / 实际占用，没有数据时为 0
        type: number
      raw_bytes:
        type: integer
      snapshots:
        type: integer
      status:
        description: unknown | ok | not_mounted | error
        type: string
      stored_bytes:
        type: integer
      type:
        type: string
    type: object
  overview.Summary:
    properties:
      attention:
        type: integer
      jobs:
        type: integer
      ok:
        description: 既不需要处理也没有暂停的任务数
        type: integer
      paused:
        type: integer
      repos:
        type: integer
      servers:
        type: integer
    type: object
  overview.Timeline:
    properties:
      ahead_hours:
        type: integer
      from:
        type: integer
      jobs:
        items:
          $ref: '#/definitions/overview.TimelineJob'
        type: array
      to:
        type: integer
      window:
        type: string
    type: object
  overview.TimelineJob:
    properties:
      job_id:
        type: integer
      last_status:
        description: 最近一次有结果的运行；没有运行过为空
        type: string
      name:
        type: string
      next_run_at:
        description: 下次运行，Unix 秒；已暂停为 0
        type: integer
      paused:
        type: boolean
      planned:
        description: 窗口之后的计划运行时间，升序
        items:
          type: integer
        type: array
      runs:
        description: 窗口内已经发生的运行（不含跳过），按开始时间升序
        items:
          $ref: '#/definitions/overview.TimelineRun'
        type: array
      schedule:
        $ref: '#/definitions/job.ScheduleInput'
        description: 计划，轨道标题下据此写「每天 03:00」
      source_type:
        type: string
    type: object
  overview.TimelineRun:
    properties:
      id:
        type: integer
      started_at:
        type: integer
      status:
        description: running | success | warning | failed
        type: string
    type: object
  overview.Totals:
    properties:
      raw_bytes:
        type: integer
      snapshots:
        type: integer
      stored_bytes:
        type: integer
    type: object
  repo.CheckRequest:
    type: object
  repo.CheckResponse:
    type: object
  repo.CreateRequest:
    properties:
      existing_password:
        description: 已是 restic 仓库时，它现有的密码；只用于接入，不保存
        type: string
      name:
        type: string
      params:
        $ref: '#/definitions/repo.Params'
        description: 按类型填写的地址参数与凭据
      recovery_key:
        description: 同时加入一把恢复密钥；不传默认加入
        type: boolean
      recovery_key_saved:
        description: 管理员确认「已存进密码管理器」；加入恢复密钥时必须为 true
        type: boolean
      recovery_key_value:
        description: 恢复密钥：先经 POST /repos/recovery-key 取得并展示给管理员，保存时原样提交；opsnap 不保存
        type: string
      type:
        type: string
    type: object
  repo.CreateResponse:
    properties:
      adopted:
        description: 接入的是已有仓库
        type: boolean
      recovery_key_error:
        description: 仓库已保存，但恢复密钥没有加入成功的原因；可稍后在密钥对话框里重新生成
        type: string
    type: object
  repo.DeleteRequest:
    type: object
  repo.DeleteResponse:
    type: object
  repo.GenerateRecoveryKeyRequest:
    properties:
      recovery_key_saved:
        description: 管理员确认「已存进密码管理器」，必须为 true
        type: boolean
      recovery_key_value:
        description: 经 POST /repos/recovery-key 取得并展示过的恢复密钥；opsnap 不保存
        type: string
    type: object
  repo.GenerateRecoveryKeyResponse:
    type: object
  repo.GetResponse:
    type: object
  repo.Item:
    properties:
      address:
        description: 仓库地址，不含凭据
        type: string
      created_at:
        type: integer
      dedup_ratio:
        description: 去重压缩比 = 原始数据量 / 实际占用，没有数据时为 0
        type: number
      encryption:
        description: 加密方式，restic 仓库固定为 AES-256
        type: string
      free_space:
        description: NAS 剩余空间，字节；拿不到时为 null
        type: integer
      id:
        type: integer
      job_count:
        type: integer
      key_count:
        type: integer
      last_check_at:
        type: integer
      last_check_message:
        type: string
      last_check_ok:
        type: boolean
      last_prune_at:
        type: integer
      last_prune_message:
        type: string
      last_prune_ok:
        type: boolean
      maintenance:
        description: 正在进行的维护：check | prune，空表示没有
        type: string
      name:
        type: string
      no_recovery_key:
        description: 没有恢复密钥，界面显示警告「没有恢复密钥」
        type: boolean
      params:
        $ref: '#/definitions/repo.Params'
        description: 地址参数；凭据只返回占位
      raw_size:
        description: 原始数据量（restic stats restore-size），字节
        type: integer
      snapshot_count:
        type: integer
      stats_at:
        description: 统计数据的更新时间，0 表示还没有统计
        type: integer
      status:
        description: unknown | ok | not_mounted | error
        type: string
      status_at:
