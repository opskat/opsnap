# 复制为 configs/config.yaml 后按需修改；config.yaml 不提交
env: DEV
source: file
debug: true

http:
  address:
    - "127.0.0.1:8210"
  # 反向代理的地址（IP 或 CIDR）。只有来自这些地址的请求才采用 X-Forwarded-For 作为客户端 IP，
  # 登录限速按客户端 IP 计算；留空表示不信任任何代理
  trustedProxies: []

logger:
  level: info
  disableConsole: false
  logFile:
    enable: true
    filename: ./runtime/logs/opsnap.log
    errorFilename: ./runtime/logs/opsnap.err.log

db:
  driver: sqlite
  dsn: "./runtime/opsnap.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"
