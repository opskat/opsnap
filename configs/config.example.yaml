# 复制为 configs/config.yaml 后按需修改；config.yaml 不提交
env: DEV
source: file
debug: true

http:
  address:
    - "127.0.0.1:8210"
  # 反向代理的地址（IP 或 CIDR）。只有来自这些地址的请求才采用 X-Forwarded-For 作为客户端 IP，
  # 登录限速按客户端 IP 计算；留空表示不信任任何代理
  trustedProxies: []

logger:
  level: info
  disableConsole: false
  logFile:
    enable: true
    filename: ./runtime/logs/opsnap.log
    errorFilename: ./runtime/logs/opsnap.err.log

db:
  driver: sqlite
  dsn: "./runtime/opsnap.db?_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)"

# tools:
#   # 导出工具（mysqldump、pg_dump、pg_dumpall）的目录，能力探测与备份共用。可以按版本放多个客户端，
#   # 工具放在子目录的 bin/ 下：mysql-<主>.<次>（如 mysql-8.4）、postgresql-<主>（如 postgresql-16）、
#   # mariadb（mariadb-dump 或 mysqldump，用于 MariaDB 服务端）。有版本子目录时选不低于服务端版本的最低版本，
#   # 都低于服务端时选最高版本；没有版本子目录时先在 PATH 中查找，再到这个目录中找。留空或不配置时只在 PATH 中查找
#   dir: /opt/opsnap/tools
