# 推送 v* 标签时发布：先跑与 CI 相同的检查，再构建 linux/amd64 镜像推到 ghcr.io/opskat/opsnap，
# 最后用 CHANGELOG.md 里对应版本的段落创建 GitHub Release。
# 只发 amd64：运行时镜像里的 mysql-community-client 与 mongodb-database-tools 来自官方 Debian 源，只有 amd64 包。
name: release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: 取出本版本的更新说明
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## " { if (p) exit; p = index($0, "## " v) == 1; next } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md 里没有 ${TAG#v} 的段落" >&2; exit 1; }
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "opsnap $TAG" --notes-file notes.md --verify-tag
