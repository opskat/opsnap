name: Nightly

# nightly 分支是 main 的每日快照：定时把 main 合进来，跑一遍 CI 同款的 Go 与前端检查，
# 通过后推 ghcr.io/opskat/opsnap:nightly 与 :nightly-<UTC 日期>（spec「Docker 镜像」→
# 「nightly 构建」）。
#
# 它不是发版：不碰 latest，也不建 GitHub Release。按版本号发布正式镜像留到 v1
# （spec「不在本期范围」）。
#
# 两个别忘了的前提，见 docs/develop.md#nightly-镜像：
#   1. nightly 分支要先存在：`git push origin main:nightly`。它不存在时 sync 作业的
#      checkout 会直接失败——比「安静地不构建」好，但仍然不会自己把分支建出来。这一推
#      本身会触发下面的 push 触发器，正好完成 spec 决策 11 要求的「合并后手动触发一次
#      确认」。
#   2. 仓库连续 60 天没有活动时，GitHub 会静默停掉定时任务，镜像停更不会报任何错，
#      只会不再更新。发现的办法只有去 Actions 页面看 Nightly 是不是 disabled。
#
# 「是否已经发布过」记在 git 引用 refs/nightly/published 上：发布成功后它被移到刚发布的
# 那个 nightly 提交。定时/手动触发时，nightly 头部等于这个引用才跳过；引用不存在按「没
# 发布过」处理。删掉这个引用，下一次定时运行就会重新构建并发布当前的 nightly 头部。
# 不用标签：会移动的标签让已经取过它的克隆在 git fetch/pull --tags 时报「会覆盖现有
# 标签」，git describe --tags 也会看到它；refs/tags 之外的引用默认既不会被克隆取下来，
# 也不会被 describe 看到。
on:
  # 手动跑一次：想马上验证某个提交，或触发上面第 1 条的一次性确认时用得上。
  workflow_dispatch:
  schedule:
    # cron 一律按 UTC 算：18:00 UTC = 北京时间凌晨 2:00（spec「nightly 构建」）。
    - cron: "0 18 * * *"
  # 有人手动往 nightly 推东西时也构建一次。Actions 用它自己的 GITHUB_TOKEN 推的分支
  # 不会产生新的工作流运行（防自激），所以下面 sync 作业推的那次不会再触发这里。
  push:
    branches: [nightly]

permissions:
  contents: read

concurrency:
  # 定时、手动与 push 可能撞在一起，取消旧的而不是排队：三者跑的是同一份东西，
  # 晚开始的那次手上的提交更新。被取消的那次没发布，refs/nightly/published 也就没动，它
  # 手上的提交不会丢：下一次运行看到头部与这个引用不一致，照样构建发布。
  group: nightly
  cancel-in-progress: true

jobs:
  sync:
    name: Merge main into nightly
    # 只有定时与手动触发才需要合并；push 触发的那次是「nightly 刚被人推过」，
    # 再合并一次没有意义。
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nightly
          # fetch-depth: 0 同时把远端分支取下来，下面的 origin/main 才有得合。
          fetch-depth: 0
      - name: Merge main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)
          # 冲突就停在这里：nightly 保持原样，工作流报错，等人来看
          # （spec「nightly 构建」：合并冲突时停下，nightly 保持原样）。不替人挑版本，
          # 也不推一个半合起来的树上去。
          #
          # 显式判失败而不是靠 Actions 默认的 bash -e：那个默认值一改（或者哪天有人给
          # 这一步加了 shell:）就会变成「冲突后什么都没推，作业却成功」，后面的 prepare
          # 照样往下走，一次安静的假成功。
          if ! git merge origin/main --no-edit; then
            echo "::error::nightly 与 main 冲突，nightly 保持原样，需要人工解决"
            exit 1
          fi
          after=$(git rev-parse HEAD)

          # main 没有新提交不等于不用构建：上一次 push 触发的运行可能被取消、发布可能
          # 失败过。要不要构建交给 prepare 按 refs/nightly/published 判断，这里只管合并。
          if [ "$before" = "$after" ]; then
            echo "main 没有新提交，nightly 保持不变。" >> "$GITHUB_STEP_SUMMARY"
          else
            git push
          fi

  prepare:
    name: Compute version
    needs: [sync]
    # push 触发时 sync 被跳过，而那种情况恰恰要构建，所以这里不能因为依赖被跳过就
    # 跟着跳过。
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      commit: ${{ steps.ver.outputs.commit }}
      sha: ${{ steps.ver.outputs.sha }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      # 在 sync 之后才检出，看到的是 sync 推上去的合并结果。不用 github.sha：定时/手动
      # 触发时它是 main 的提交，不是 nightly 的。
      - uses: actions/checkout@v6
        with:
          ref: nightly
          fetch-depth: 0
      - name: Compute version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # 本次运行钉住的提交：测试、镜像构建、版本号与 commit 都用这一个完整 SHA，
          # 而不是会移动的 nightly 分支名。否则 nightly 前进之后重跑某个失败的作业，
          # 会用旧的日期与短号去构建一份更新的代码。
          sha=$(git rev-parse HEAD)
          # 界面显示的版本号为 nightly-<UTC 日期>，commit 为构建出的 nightly 提交的
          # 短号（spec「Docker 镜像」→「运行」）。
          {
            echo "version=nightly-$(date -u +%Y%m%d)"
            echo "commit=${sha:0:7}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

          # checkout 不取 refs/tags 之外的引用，得单独取。远端没有这个引用时 fetch 报错，
          # 这里忽略；别的原因取失败（网络、权限）同样被忽略，但新的 runner 上本地本来就
          # 没有这个引用，取失败只会让 published 为空、按「没发布过」构建，不会被误判成
          # 「已发布」而跳过——宁可多构建一次，不能漏发。
          if ! git fetch --no-tags origin '+refs/nightly/published:refs/nightly/published'; then
            echo "未取到 refs/nightly/published（远端没有，或取失败），按没发布过处理。" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 引用不存在时 published 为空，与任何 SHA 都不相等，按「没发布过」构建。
          published=$(git rev-parse -q --verify 'refs/nightly/published^{commit}' || true)

          # 定时/手动触发，且这个提交已经发布过：整条流水线短路，不重复构建一份一样的
          # 镜像（spec「nightly 构建」：nightly 头部已经发布过时跳过）。只看 main 有没有
          # 新提交是不够的：被取消的 push 运行、发布失败的运行，手上的提交都还没发布。
          # push 触发一律构建：有人刚推过 nightly，就是想要一份新镜像。
          if [ "$EVENT" != "push" ] && [ "$sha" = "$published" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "nightly 头部 ${sha} 已经发布过（refs/nightly/published），跳过本次构建。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "本次构建 nightly 提交 ${sha}（上次发布：${published:-无}）。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 推送前先跑测试，失败则不推送（spec「nightly 构建」）。这两个作业照抄 ci.yml 的
  # go 与 frontend 任务的步骤，只是把 checkout 换成 prepare 钉住的 nightly 提交：nightly
  # 与 main 内容可能不同（沿用 main 上现有的门禁，构建出的镜像也是这份代码，不是再验
  # 一次 main）；用 SHA 而不是分支名，重跑时测的仍是本次运行要发布的那个提交。
  test-go:
    name: Go lint & test (nightly)
    needs: [prepare]
    # 不能省略状态检查函数：没有时 GitHub 会隐式补上 success()，而它会检查所有祖先
    # 作业（含经 prepare 间接依赖的 sync）。push 触发时 sync 按设计被跳过，测试就会
    # 跟着被跳过，publish 却照样发布（曾经的事故）。用 !cancelled() 而不是 always()：
    # 两者都能去掉隐式 success()，但 always() 会让被 concurrency 取消的旧运行照样把
    # 作业跑起来。再显式要求 prepare 成功（sync 冲突失败时 prepare 被跳过，测试也就
    # 不跑）且没有被短路。
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - run: go test ./...

  test-frontend:
    name: Frontend lint & test (nightly)
    needs: [prepare]
    # 同 test-go：必须 !cancelled() + 显式检查 prepare，原因见上。
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm -C frontend install --frozen-lockfile
      - run: pnpm -C frontend lint
      - run: pnpm -C frontend test
      - run: pnpm -C e2e install --frozen-lockfile
      - run: pnpm -C e2e lint

  publish:
    name: Publish the image
    needs: [prepare, test-go, test-frontend]
    # 只有 prepare 与两个测试作业都明确 success 才发布：测试失败、取消或被跳过（含
    # skip=true 的短路）一律不发布，不依赖 !failure() 这类对 skipped 放行的写法。
    # !cancelled() 是为了让 push 触发时被跳过的 sync 不拦住这里（隐式 success() 会），
    # 同时整条运行被取消时也不发布（always() 做不到）。
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' && needs.test-go.result == 'success' && needs.test-frontend.result == 'success' }}
    # 按架构原生构建、合成 manifest list 的细节都在被调用的工作流里；以后要加「按版本号
    # 发布正式镜像」时调的是同一个，nightly 与正式镜像的结构不会各走各的。
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      # 推标签前确认远端 nightly 仍指向上面这个提交；已经前进了（典型情况：nightly 移动
      # 之后有人重跑了这次运行）就不推标签，免得 :nightly 退回旧提交，原因写进运行摘要。
      expect-branch: nightly
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      # 两个标签各有各的用处：
      #   nightly             跟着走的那个，每天换一份内容。
      #   nightly-<UTC 日期>  钉住某一天的，回看与回滚时用得上；日期与 cron 同一个
      #                       时区，免得「凌晨那次算哪天」变成一个要查的问题。
      # 不打 latest，也不建 GitHub Release（spec「nightly 构建」）。
      tags: |
        type=raw,value=nightly
        type=raw,value=${{ needs.prepare.outputs.version }}

  mark-published:
    name: Mark the commit as published
    needs: [prepare, publish]
    # 只有镜像标签真的推到了这个提交上（published=true）才移动 refs/nightly/published：
    # 测试失败、发布失败、被新提交取代或整条运行被取消时都不动它，下一次运行会把这个提交
    # 补发出去。
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    # 推引用要写权限，只给这一个作业。用 GITHUB_TOKEN 推的引用不会触发新的工作流运行
    # （push 触发器也只认 nightly 分支）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Move refs/nightly/published
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # 与 docker-publish.yml 推镜像标签前的检查同理：nightly 已经前进时不动书签。
          # 典型情况是这个作业失败后，在新提交已经发布之后才被「重跑失败的作业」：不检查
          # 的话书签会退回旧提交，下一次定时运行又把已发布的头部重复构建一遍。
          # 不用管道：默认 shell 没有 pipefail，查询失败会被吞成空串。直接赋值时失败即
          # 作业失败，书签同样不动，下一次运行补发。
          head=$(git ls-remote --exit-code origin refs/heads/nightly)
          head=${head%%[[:space:]]*}
          if [ "$head" != "$SHA" ]; then
            echo "已被新提交取代：本次发布的是 ${SHA}，远端 nightly 已指向 ${head}，refs/nightly/published 保持不动。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 强制移动：它只是一个「发布到哪了」的书签，不是版本号，所以放在 refs/tags 之外。
          git push --force origin "${SHA}:refs/nightly/published"
          echo "refs/nightly/published 已移到 ${SHA}。" >> "$GITHUB_STEP_SUMMARY"
