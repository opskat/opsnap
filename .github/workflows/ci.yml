# 与本地 make check 相同的检查：Go 测试（含架构门禁）、golangci-lint、前端类型检查 + ESLint/Prettier + vitest。
# 集成测试（make it）依赖 opsctl 与集成测试主机，不在 CI 里运行。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: go test
        run: make test
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: typecheck + lint + vitest
        run: make frontend-test
