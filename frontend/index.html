<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpsNap</title>
    <script>
      // 在首帧渲染前套用主题，避免深色用户刷新时闪白；逻辑与 src/lib/theme.tsx 保持一致
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("opsnap-theme") || "system";
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
