version: "2"

# OpsNap 保存数据源凭据和仓库密钥，gosec 不做任何全局排除。
# 确有必要的例外，在调用处写 `//nolint:gosec // <原因>`（nolintlint 要求写明原因）。
linters:
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - forbidigo
    - gosec
    - loggercheck
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert

  exclusions:
    paths:
      - ".*/mock/.*"
    rules:
      # 入口在日志组件就绪前可能需要直接输出启动错误
      - path: cmd/
        linters: [forbidigo]

  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: "用 cago 的 logger.Ctx(ctx) 输出日志，不用 fmt.Print（docs/develop.md#logging）"
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # 本项目的包单独成组，放在第三方包之后
      local-prefixes:
        - github.com/opskat/opsnap

run:
  timeout: 10m
