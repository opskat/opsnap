# docker.local 上的真实环境测试服务（compose 项目名 opsnap-test）。
# 只用于本地真实验证，不用于 CI；由 scripts/test-env.sh 部署。密码来自同目录 .env（部署脚本生成，不提交）。
# 端口避开宿主机上其他项目已占用的 3306/5432/6379 等，以及本文件里已用过的端口
# （docs/verification.md#test-environment）。
name: opsnap-test

services:
  mysql80:
    image: ${REGISTRY_MIRROR:-}docker.io/library/mysql:8.0
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --innodb-buffer-pool-size=128M
      # 首包有时要 20-40s（疑似客户端反向 DNS 解析等待），跳过它
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
    ports:
      - "13306:3306"
    volumes:
      - mysql80:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30

  pg16:
    image: ${REGISTRY_MIRROR:-}docker.io/library/postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
    ports:
      - "15432:5432"
    volumes:
      - pg16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

  minio:
    # MinIO 已停止在 Docker Hub 发布社区版镜像，使用 quay.io 并固定版本
    image: ${REGISTRY_MIRROR:-}quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: opsnap
      MINIO_ROOT_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 30

  keycloak:
    # OIDC 真实验证用的 IdP：realm opsnap、客户端 opsnap（Secret 与用户 ops/other 的密码均为 OPSNAP_TEST_PASSWORD），
    # 回调地址见 keycloak/opsnap-realm.json。仅用于测试，start-dev 模式、无持久化
    image: ${REGISTRY_MIRROR:-}docker.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
      OPSNAP_TEST_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    ports:
      - "18080:8080"
    volumes:
      - ./keycloak/opsnap-realm.json:/opt/keycloak/data/import/opsnap-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  ssh-jump:
    # 数据源轮（docs/specs/2026-09-25-datasources.md）运行时验证用的网络通道跳板；用户 opsnap，
    # 密码为测试密码。ssh-target 不发布端口，只能从这台跳板（同一 compose 网络）到达
    image: ${REGISTRY_MIRROR:-}docker.io/linuxserver/openssh-server
    environment:
      PUID: 1000
      PGID: 1000
      PASSWORD_ACCESS: "true"
      USER_NAME: opsnap
      USER_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
      SUDO_ACCESS: "false"
    ports:
      - "12222:2222"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/2222"]
      interval: 5s
      retries: 30

  ssh-target:
    # 服务器文件数据源的目标主机；只经 ssh-jump 转发到达（不发布端口），验证「SOCKS5 → SSH → 目标主机」链路
    image: ${REGISTRY_MIRROR:-}docker.io/linuxserver/openssh-server
    environment:
      PUID: 1000
      PGID: 1000
      PASSWORD_ACCESS: "true"
      USER_NAME: opsnap
      USER_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
      SUDO_ACCESS: "false"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/2222"]
      interval: 5s
      retries: 30

  socks5:
    # 用户名密码认证的 SOCKS5 代理，验证「SOCKS5 → SSH/MySQL/PG」链路
    image: ${REGISTRY_MIRROR:-}docker.io/serjs/go-socks5-proxy
    environment:
      PROXY_USER: opsnap
      PROXY_PASSWORD: ${OPSNAP_TEST_PASSWORD:?缺少 OPSNAP_TEST_PASSWORD}
    ports:
      - "11080:1080"

volumes:
  mysql80:
  pg16:
  minio:
